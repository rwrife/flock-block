name: Release (TestFlight)

# Issue #7: on a `v*` tag, archive with the pinned iOS 26 SDK, sign via the
# App Store Connect API (repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# ASC_TEAM_ID — names only, values never logged), upload a TestFlight build,
# wait for ASC processing, and create a GitHub release.
# Ported from the proven rwrife/cook-console release pipeline.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match the VERSION file, e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    # JOB-level secret env: archive/export/poll/beta-group steps all consume
    # the ASC identifiers, and Tools/asc_jwt.rb reads them from env too.
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release secret NAMES are wired (values never logged)
        run: |
          set -euo pipefail
          MISSING=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 ASC_TEAM_ID; do
            # Test for presence WITHOUT echoing the value.
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is not set for this repository"
              MISSING=1
            else
              echo "secret $name: present"
            fi
          done
          exit $MISSING

      - name: Resolve version (tag must match VERSION file)
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$REQUESTED_VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          FILE_VERSION="$(cat VERSION)"
          if [[ ! "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be x.y.z"
            exit 1
          fi
          if [ "$TAG" != "v$FILE_VERSION" ]; then
            echo "::error::tag '$TAG' does not match VERSION file 'v$FILE_VERSION'. Bump VERSION, merge, then tag."
            exit 1
          fi
          # The Actions run number doubles as the TestFlight build number:
          # strictly monotonic across all releases, never reused.
          {
            echo "VERSION=$FILE_VERSION"
            echo "RELEASE_TAG=$TAG"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Releasing Flock Block $FILE_VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Select pinned Xcode (exact 26.0.1 / 17A400 / iPhoneOS SDK pin)
        run: |
          set -euo pipefail
          SELECTED="$(python3 Scripts/select_xcode.py --toolchain toolchain.json)"
          export DEVELOPER_DIR="$SELECTED"
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ensure iOS device platform is installed for the pinned Xcode
        run: |
          set -euo pipefail
          probe() {
            xcodebuild -showdestinations \
              -project FlockBlock.xcodeproj -scheme FlockBlock 2>&1
          }
          LINE="$(probe | grep 'Any iOS Device' || true)"
          if [ -z "$LINE" ] || printf '%s' "$LINE" | grep -q 'error:'; then
            echo "iOS platform missing for pinned Xcode ($LINE) — downloading..."
            xcodebuild -downloadPlatform iOS -architectureVariant universal
            LINE="$(probe | grep 'Any iOS Device' || true)"
          fi
          if [ -z "$LINE" ] || printf '%s' "$LINE" | grep -q 'error:'; then
            echo "::error::no usable Any iOS Device destination under the pinned Xcode: $LINE"
            exit 1
          fi
          echo "Archive destination ready: $LINE"

      - name: Install App Store Connect API key (mode 600, never logged)
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"
          echo "API key installed (name ASC_KEY_P8, file mode $(stat -f '%Lp' "$RUNNER_TEMP/asc-api-key.p8"))."

      - name: Archive (signed, pinned iOS 26 SDK)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project FlockBlock.xcodeproj \
            -scheme FlockBlock \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlockBlock.xcarchive" \
            -configuration Release \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$RUNNER_TEMP/asc-api-key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Verify archived bundle id + iPhone-only device family
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/FlockBlock.xcarchive/Products/Applications/FlockBlock.app/Info.plist"
          plutil -convert json -o "$RUNNER_TEMP/archive-info.json" "$PLIST"
          python3 - "$RUNNER_TEMP/archive-info.json" <<'PYTHON'
          import json, sys
          info = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_id = "com.infinityball.flockblock"
          if info.get("CFBundleIdentifier") != expected_id:
              raise SystemExit(f"archived CFBundleIdentifier must be {expected_id}, observed {info.get('CFBundleIdentifier')!r}")
          family = info.get("UIDeviceFamily")
          if family != [1]:
              raise SystemExit(f"archived UIDeviceFamily must be [1], observed {family!r}")
          print(f"Verified archived CFBundleIdentifier == {expected_id}, UIDeviceFamily == [1]")
          PYTHON

      - name: Export signed IPA and upload to TestFlight (ASC API key)
        run: |
          set -euo pipefail
          # destination=upload delivers the .ipa straight to App Store Connect
          # using the API key — the documented Xcode 26 path (no altool).
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>uploadMethod</key><string>app-store-connect</string>
            <key>teamID</key><string>__TEAM__</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__TEAM__/$ASC_TEAM_ID/" "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FlockBlock.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc-api-key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for ASC processing and register the build
        run: |
          set -euo pipefail
          export ASC_KEY_FILE="$RUNNER_TEMP/asc-api-key.p8"
          API=https://api.appstoreconnect.apple.com
          JWT="$(ruby Tools/asc_jwt.rb)"
          APP_ID="$(curl -g -sS --fail -H "Authorization: Bearer $JWT" \
            "$API/v1/apps?filter[bundleId]=com.infinityball.flockblock" \
            | jq -r '.data[0].id')"
          [ "$APP_ID" != "null" ] || { echo "::error::bundle id not found in App Store Connect"; exit 1; }
          echo "ASC app id: $APP_ID"

          BUILD_ID=""
          STATE=""
          for i in $(seq 1 45); do
            JWT="$(ruby Tools/asc_jwt.rb)"
            SNAP="$(curl -g -sS --fail -H "Authorization: Bearer $JWT" \
              "$API/v1/builds?filter[app]=$APP_ID&sort=-uploadedDate&limit=5")"
            ENTRY="$(echo "$SNAP" | jq -r --arg v "$BUILD_NUMBER" '
              ([.data[] | select(.attributes.version == $v)])
              | if length > 0 then (.[0] | .id + " " + .attributes.processingState) else "" end')"
            BUILD_ID="${ENTRY%% *}"
            STATE="${ENTRY#* }"
            echo "poll $i: build-id=${BUILD_ID:-none} processing=${STATE:-unknown}"
            # Classic builds report VALID when processed; newer TestFlight
            # processing reports COMPLETE. Accept either.
            if [ -n "$BUILD_ID" ] && { [ "$STATE" = "VALID" ] || [ "$STATE" = "COMPLETE" ]; }; then
              break
            fi
            sleep 20
          done
          [ -n "${BUILD_ID:-}" ] || { echo "::error::TestFlight build never appeared for version $BUILD_NUMBER"; exit 1; }
          if [ "$STATE" != "VALID" ] && [ "$STATE" != "COMPLETE" ]; then
            echo "::error::build $BUILD_ID stuck in processing state '$STATE'"
            exit 1
          fi
          echo "ASC_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "TestFlight build registered: $BUILD_ID"

      - name: Add build to Internal testers with release notes
        run: |
          set -euo pipefail
          export ASC_KEY_FILE="$RUNNER_TEMP/asc-api-key.p8"
          API=https://api.appstoreconnect.apple.com
          NOTES="$(git log -1 --format=%s "$GITHUB_REF_NAME" 2>/dev/null || echo "Flock Block $VERSION")"
          NOTES="${NOTES//\"/\\\"}"  # escape quotes for JSON
          JWT="$(ruby Tools/asc_jwt.rb)"
          APP_ID="$(curl -g -sS --fail -H "Authorization: Bearer $JWT" \
            "$API/v1/apps?filter[bundleId]=com.infinityball.flockblock" | jq -r '.data[0].id')"
          JWT="$(ruby Tools/asc_jwt.rb)"
          GROUP_ID="$(curl -g -sS --fail -H "Authorization: Bearer $JWT" \
            "$API/v1/betaGroups?filter[app]=$APP_ID&filter[name]=Internal" | jq -r '.data[0].id // empty')"
          if [ -z "$GROUP_ID" ]; then
            JWT="$(ruby Tools/asc_jwt.rb)"
            GROUP_ID="$(curl -g -sS --fail -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json' -X POST "$API/v1/betaGroups" \
              -d "{\"data\":{\"type\":\"betaGroups\",\"attributes\":{\"name\":\"Internal\",\"isInternalGroup\":true},\"relationships\":{\"app\":{\"data\":{\"type\":\"apps\",\"id\":\"$APP_ID\"}}}}}" \
              | jq -r '.data.id')"
          fi
          JWT="$(ruby Tools/asc_jwt.rb)"
          curl -g -sS --fail -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
            -X POST "$API/v1/builds/$ASC_BUILD_ID/relationships/betaGroups" \
            -d "{\"data\":[{\"type\":\"betaGroups\",\"id\":\"$GROUP_ID\"}]}" > /dev/null
          JWT="$(ruby Tools/asc_jwt.rb)"
          curl -g -sS --fail -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
            -X POST "$API/v1/betaBuildLocalizations" \
            -d "{\"data\":{\"type\":\"betaBuildLocalizations\",\"attributes\":{\"locale\":\"en-US\",\"whatsNew\":\"$NOTES\"},\"relationships\":{\"build\":{\"data\":{\"type\":\"builds\",\"id\":\"$ASC_BUILD_ID\"}}}}}" > /dev/null
          echo "Build $ASC_BUILD_ID added to Internal group with notes: $NOTES"

      - name: Create GitHub release (changelog anchor)
        if: success()
        run: |
          set -euo pipefail
          # RELEASE_TAG (not GITHUB_REF_NAME) — on workflow_dispatch the ref
          # is a branch name, not the version tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists — skipping creation."
          else
            gh release create "$RELEASE_TAG" --generate-notes \
              --title "Flock Block $VERSION (build $BUILD_NUMBER)"
          fi
          gh release view "$RELEASE_TAG" --json tagName,url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove API key material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-api-key.p8"
          echo "asc-api-key.p8 removed from runner temp."

      - name: Upload archive metadata (provenance)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flockblock-archive-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/*.plist
            ${{ runner.temp }}/ipa/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 30
